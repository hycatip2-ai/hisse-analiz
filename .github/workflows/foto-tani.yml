name: Foto Üret - Teşhis

# Modal kayıtlarını ve kullanım bilgisini gösterir (yalnızca elle çalıştırılır).
on:
  push:
    paths:
      - ".github/workflows/foto-tani.yml"
  workflow_dispatch:
    inputs:
      sure:
        description: "Kaç saatlik kayıt (örn. 3h, 1d)"
        default: "6h"

jobs:
  teshis:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal
      - name: Çalışan konteynerler
        run: modal container list || true
      - name: Video üretim kayıtları
        run: |
          modal app logs foto-uret --since "${{ inputs.sure || '8h' }}" --timestamps --show-function-id \
            --show-container-id --tail 2000 2>&1 | grep -v "/api/is/" | tail -400 || true
      - name: Bu ayın kullanımı
        run: modal billing summary || true
      - name: Saatlik kullanım (son 1 gün)
        run: modal billing report --for today --resolution h --show-resources || true
      - uses: actions/checkout@v4
      - name: Saatlik kullanım (son 3 gün, kaynak bazında)
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import modal
          w = modal.Workspace.from_context()
          bas = (datetime.now(timezone.utc) - timedelta(days=3)).replace(minute=0, second=0, microsecond=0)
          for r in w.billing.report(start=bas, resolution="h"):
              k = {a: round(float(v), 2) for a, v in r.cost_by_resource.items() if float(v) >= 0.05}
              if k:
                  print(r.interval_start.strftime("%m-%d %H:00"), round(float(r.cost), 2), k)
          PY
      - name: Kota ekranının okuduğu veri
        working-directory: foto-uret
        env:
          KOTA_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          KOTA_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -c "import json, foto; print(json.dumps(foto.kota_bilgisi(), indent=2, default=str))"
