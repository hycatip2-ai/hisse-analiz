name: Foto Üret - Modal'a yükle

# foto-uret/ klasörünü Modal'a deploy eder; bilgisayar gerekmez.
# Gerekli GitHub secret'ları: MODAL_TOKEN_ID, MODAL_TOKEN_SECRET, FOTO_SIFRE
# Video için ayrıca: HF_TOKEN (LTX-2.5 erişimi kabul edilmiş Hugging Face hesabının token'ı)
# Araştırma için: OPENROUTER_API_KEY ve TAVILY_API_KEY (ikisi de ücretsiz hesap)
on:
  push:
    paths:
      - "foto-uret/**"
      - ".github/workflows/foto-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      FOTO_SIFRE: ${{ secrets.FOTO_SIFRE }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - name: Secret'lar tanımlı mı?
        id: kontrol
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ] || [ -z "$FOTO_SIFRE" ]; then
            echo "::warning::MODAL_TOKEN_ID, MODAL_TOKEN_SECRET ve FOTO_SIFRE secret'ları eklenmemiş; deploy atlandı."
            echo "hazir=false" >> "$GITHUB_OUTPUT"
          else
            echo "hazir=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.kontrol.outputs.hazir == 'true'

      - uses: actions/setup-python@v5
        if: steps.kontrol.outputs.hazir == 'true'
        with:
          python-version: "3.12"

      - name: Modal'ı kur
        if: steps.kontrol.outputs.hazir == 'true'
        run: pip install modal

      - name: Şifreyi Modal'a kaydet
        if: steps.kontrol.outputs.hazir == 'true'
        run: |
          modal secret create foto-sifre "SIFRE=$FOTO_SIFRE" --force > /dev/null
          modal secret create foto-hf "HF_TOKEN=${HF_TOKEN:-yok}" --force > /dev/null
          # Kota ekranı Modal kullanımını bu anahtarla okur.
          modal secret create foto-kota "KOTA_TOKEN_ID=$MODAL_TOKEN_ID" "KOTA_TOKEN_SECRET=$MODAL_TOKEN_SECRET" --force > /dev/null
          # Araştırma asistanı; anahtar yoksa uygulama bunu kullanıcıya söyler.
          modal secret create foto-arastirma "OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-yok}" "TAVILY_API_KEY=${TAVILY_API_KEY:-yok}" --force > /dev/null

      - name: Deploy
        if: steps.kontrol.outputs.hazir == 'true'
        working-directory: foto-uret
        run: modal deploy foto.py

      # Qwen-Image-2.1 (~33 GB) fotoğraf modelini GPU'suz makinede indirir; zaten varsa hızlıca geçer.
      - name: Fotoğraf modelini indir
        if: steps.kontrol.outputs.hazir == 'true'
        working-directory: foto-uret
        run: modal run foto.py::foto_modeli_indir

      # Video modelini (~115 GB) GPU'suz ucuz bir makinede indirir; zaten varsa hızlıca geçer.
      - name: Video modelini indir
        if: steps.kontrol.outputs.hazir == 'true'
        working-directory: foto-uret
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret'ı eklenmemiş; video modeli indirilemedi. KURULUM.md'deki Hugging Face adımlarına bakın."
            exit 0
          fi
          modal run foto.py::video_modeli_indir

      # Wan 2.2 (~69 GB, BF16) ve hızlandırıcı LoRA'sı; açık modeller, token gerekmez.
      - name: Wan modelini indir
        if: steps.kontrol.outputs.hazir == 'true'
        working-directory: foto-uret
        run: modal run foto.py::wan_modeli_indir
