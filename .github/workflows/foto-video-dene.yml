name: Foto Üret - Video denemesi

# Video modelini gerçek GPU'da yükleyip kısa bir video üretir ve süreleri yazar
# (yaklaşık 0,3-0,6 $ GPU süresi harcar). Yalnızca elle başlatılır; kendiliğinden hiç çalışmaz.
on:
  workflow_dispatch:

jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal
      - name: Video denemesi
        working-directory: foto-uret
        run: modal run foto.py::video_dene
