name: Foto Üret - Video denemesi

# Video modelini gerçek GPU'da çalıştırır (GPU kredisi harcar). Yalnızca elle başlatılır;
# kendiliğinden hiç çalışmaz.
#   islem=dene: kısa video üretip süreleri yazar (~0,3-0,6 $)
#   islem=tani: kalite teşhisi; varyantları üretip kareleri artifact olarak yükler (~0,5-1 $)
#   islem=tani2: rehberli tam model ile aynı teşhis (~1 $)
#   islem=qwen: Qwen-Image-2.1 fotoğraf/referans denemesi (~0,3 $)
#   islem=foto: uygulamadaki Qwen fotoğraf yolunu dener (~0,05 $)
#   islem=karsilastir: Qwen vs FLUX.2 [dev], LTX-2.5 vs Wan 2.2 karşılaştırması (~2,5 $)
#   islem=flux: yalnızca Qwen vs FLUX.2 [dev] fotoğraf karşılaştırması (~0,5 $)
#   islem=wan: uygulamadaki hızlı Wan 2.2 ile 3 video (~0,5-1 $)
#   islem=fluxdene: uygulamadaki FLUX.2 yolunu dener (yazıdan + referanslı, ~0,2 $)
on:
  workflow_dispatch:
    inputs:
      islem:
        description: "dene, tani, tani2, qwen, foto, karsilastir, flux, wan veya fluxdene"
        default: "dene"

jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal
      - name: Video denemesi
        if: inputs.islem == 'dene'
        working-directory: foto-uret
        run: modal run foto.py::video_dene
      - uses: actions/upload-artifact@v4
        if: inputs.islem == 'dene'
        with:
          name: video-dene
          path: foto-uret/tani-cikti/
      - name: Video kalite teşhisi
        if: inputs.islem == 'tani'
        working-directory: foto-uret
        run: modal run araclar/video_tani.py
      - name: Video kalite teşhisi (tam model)
        if: inputs.islem == 'tani2'
        working-directory: foto-uret/araclar
        timeout-minutes: 40
        run: modal run video_tani_tam.py
      - uses: actions/upload-artifact@v4
        if: inputs.islem == 'tani2'
        with:
          name: video-tani-tam
          path: foto-uret/araclar/tani-cikti/
      - uses: actions/upload-artifact@v4
        if: inputs.islem == 'tani'
        with:
          name: video-tani
          path: foto-uret/tani-cikti/
      - name: Qwen-Image-2.1 denemesi
        if: inputs.islem == 'qwen'
        working-directory: foto-uret/araclar
        timeout-minutes: 40
        run: modal run qwen_tani.py
      - uses: actions/upload-artifact@v4
        if: inputs.islem == 'qwen'
        with:
          name: qwen-tani
          path: foto-uret/araclar/tani-cikti/
      - name: Fotoğraf denemesi
        if: inputs.islem == 'foto'
        working-directory: foto-uret
        run: modal run foto.py::foto_dene
      - uses: actions/upload-artifact@v4
        if: inputs.islem == 'foto'
        with:
          name: foto-dene
          path: foto-uret/tani-cikti/
      - name: Model karşılaştırması
        if: inputs.islem == 'karsilastir'
        working-directory: foto-uret/araclar
        timeout-minutes: 55
        run: modal run karsilastir.py
      - uses: actions/upload-artifact@v4
        if: inputs.islem == 'karsilastir'
        with:
          name: karsilastir
          path: foto-uret/araclar/tani-cikti/
      - name: FLUX.2 fotoğraf karşılaştırması
        if: inputs.islem == 'flux'
        working-directory: foto-uret/araclar
        timeout-minutes: 55
        run: modal run karsilastir.py --bolum foto
      - uses: actions/upload-artifact@v4
        if: inputs.islem == 'flux'
        with:
          name: flux
          path: foto-uret/araclar/tani-cikti/
      - name: Hızlı Wan denemesi
        if: inputs.islem == 'wan'
        working-directory: foto-uret
        timeout-minutes: 55
        run: modal run foto.py::wan_dene
      - uses: actions/upload-artifact@v4
        if: inputs.islem == 'wan'
        with:
          name: wan
          path: foto-uret/tani-cikti/
      - name: FLUX denemesi
        if: inputs.islem == 'fluxdene'
        working-directory: foto-uret
        timeout-minutes: 40
        run: modal run foto.py::flux_dene
      - uses: actions/upload-artifact@v4
        if: inputs.islem == 'fluxdene'
        with:
          name: fluxdene
          path: foto-uret/tani-cikti/
